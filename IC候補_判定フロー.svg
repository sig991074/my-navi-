<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1560" viewBox="0 0 1000 1560" font-family="Meiryo, sans-serif">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#345"/></marker></defs>
<style>
.b{fill:#e8f3fa;stroke:#176fa7;stroke-width:2}
.q{fill:#fff8cf;stroke:#b8a000;stroke-width:2}
.n{fill:#fde2e2;stroke:#c44;stroke-width:2}
.g{fill:#dff3e2;stroke:#2e9d50;stroke-width:2}
.t{font-size:15px;fill:#123}
.s{font-size:12px;fill:#567}
.l{stroke:#345;stroke-width:2;fill:none;marker-end:url(#a)}
.r{font-size:13px;fill:#a33;font-weight:bold}
</style>
<text x="500" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#123">出発地から最寄りの入口ランプを1か所取得する流れ</text>
<text x="500" y="52" text-anchor="middle" class="s">データ取得エラーと、入口が見つからない場合を分けて表示</text>

<rect class="b" x="300" y="70" width="400" height="56" rx="8"/>
<text x="500" y="95" text-anchor="middle" class="t">①ランプと接続する道路の情報を一度に取得</text>
<text x="500" y="114" text-anchor="middle" class="s">高速優先(A/B)で5km以内を検索。取得は全体で最大5分</text>
<path class="l" d="M500,126 V150"/>

<rect class="q" x="300" y="150" width="400" height="66" rx="8"/>
<text x="500" y="174" text-anchor="middle" class="t">道路データを取得できたか？</text>
<text x="500" y="195" text-anchor="middle" class="s">取得失敗は「該当なし」と分けて表示</text>
<text x="730" y="188" class="r">失敗 → エラー表示</text>
<path class="l" d="M500,216 V244"/>

<rect class="b" x="300" y="244" width="400" height="56" rx="8"/>
<text x="500" y="268" text-anchor="middle" class="t">②一般道と入口ランプの共通点を探す</text>
<text x="500" y="288" text-anchor="middle" class="s">ランプは highway=motorway_link、oneway=yes</text>
<path class="l" d="M500,300 V328"/>

<rect class="b" x="300" y="328" width="400" height="56" rx="8"/>
<text x="500" y="352" text-anchor="middle" class="t">③ランプの入口側の点を特定</text>
<text x="500" y="372" text-anchor="middle" class="s">一般道と共有するノードの座標を使う</text>
<path class="l" d="M500,384 V412"/>

<rect class="b" x="300" y="412" width="400" height="56" rx="8"/>
<text x="500" y="436" text-anchor="middle" class="t">④一方通行の進行方向を確認</text>
<text x="500" y="456" text-anchor="middle" class="s">入口の点からランプへ進む向きに絞る</text>
<path class="l" d="M500,468 V496"/>

<rect class="q" x="300" y="496" width="400" height="66" rx="8"/>
<text x="500" y="520" text-anchor="middle" class="t">ランプは高速本線につながっているか？</text>
<text x="500" y="541" text-anchor="middle" class="s">ランプの先に高速本線がないものは使わない</text>
<text x="730" y="534" class="r">未接続 → 除外</text>
<path class="l" d="M500,562 V590"/>

<rect class="b" x="300" y="590" width="400" height="66" rx="8"/>
<text x="500" y="614" text-anchor="middle" class="t">⑤高速道路名を取得</text>
<text x="500" y="635" text-anchor="middle" class="s">経路確認で対象道路を照合する</text>
<path class="l" d="M500,656 V684"/>

<rect class="q" x="300" y="684" width="400" height="76" rx="8"/>
<text x="500" y="708" text-anchor="middle" class="t">⑥出発地から最も近い入口を選ぶ</text>
<text x="500" y="729" text-anchor="middle" class="t">直線距離が5km以内か？</text>
<text x="500" y="749" text-anchor="middle" class="s">座標は一般道とランプの共有ノード</text>
<text x="730" y="722" class="r">5km超 → 対象外</text>
<path class="l" d="M500,760 V788"/>

<rect class="q" x="230" y="788" width="540" height="136" rx="8"/>
<text x="500" y="812" text-anchor="middle" class="t">⑦入口座標は1か所だけ表示</text>
<text x="500" y="834" text-anchor="middle" class="s">複数候補の一覧や選び直しは行わない</text>
<text x="250" y="860" class="t">・入口ランプ上の緯度・経度を表示</text>
<text x="250" y="882" class="t">・画面上の経由地も入口座標にする</text>
<text x="250" y="904" class="t">・検索エラーは「該当なし」と区別</text>
<text x="790" y="860" class="r">該当点なし</text>
<text x="790" y="880" class="r">→ 5km以内なし</text>
<path class="l" d="M500,924 V952"/>

<rect class="b" x="300" y="952" width="400" height="56" rx="8"/>
<text x="500" y="976" text-anchor="middle" class="t">⑧最寄りの入口へ向かう道を確認</text>
<text x="500" y="996" text-anchor="middle" class="s">出発地から共有ノードまで道路がつながるか確認</text>
<path class="l" d="M500,1008 V1036"/>

<rect class="q" x="300" y="1036" width="400" height="56" rx="8"/>
<text x="500" y="1060" text-anchor="middle" class="t">ランプ直前の一般道の補助地点を決める</text>
<text x="500" y="1080" text-anchor="middle" class="s">経路を正しくつなぐための内部地点</text>
<text x="730" y="1070" class="r">特定できない → 除外</text>
<path class="l" d="M500,1092 V1120"/>

<rect class="q" x="300" y="1120" width="400" height="56" rx="8"/>
<text x="500" y="1144" text-anchor="middle" class="t">入口ランプ座標を経由地として登録</text>
<text x="500" y="1164" text-anchor="middle" class="s">手前の補助地点→入口ランプ座標を通り、走行条件で計算</text>
<text x="730" y="1154" class="r">道路・経路確認</text>
<path class="l" d="M500,1176 V1204"/>

<rect class="b" x="300" y="1204" width="400" height="66" rx="8"/>
<text x="500" y="1228" text-anchor="middle" class="t">⑨入口ランプから目的地まで確認</text>
<text x="500" y="1249" text-anchor="middle" class="s">出発地 → 手前の補助地点 → 登録した入口ランプ → 既存経由地 → 目的地</text>
<text x="500" y="1263" text-anchor="middle" class="s">対象の高速道路に進み、Uターンがないこと</text>
<path class="l" d="M500,1270 V1298"/>

<rect class="q" x="300" y="1298" width="400" height="66" rx="8"/>
<text x="500" y="1322" text-anchor="middle" class="t">ルートは引けたか？入口ランプまで10km以内か？</text>
<text x="500" y="1343" text-anchor="middle" class="s">高速進入が確認できない／Uターンありも除外</text>
<text x="730" y="1322" class="r">引けない → 除外</text>
<text x="730" y="1343" class="r">10km超 → 除外</text>
<path class="l" d="M500,1364 V1392"/>

<rect class="q" x="300" y="1392" width="400" height="56" rx="8"/>
<text x="500" y="1416" text-anchor="middle" class="t">条件を満たした入口を1か所だけ表示</text>
<text x="500" y="1436" text-anchor="middle" class="s">走行条件、対象高速、Uターンなしを確認</text>
<path class="l" d="M500,1448 V1476"/>

<rect class="g" x="300" y="1476" width="400" height="56" rx="8"/>
<text x="500" y="1500" text-anchor="middle" class="t">最寄り入口を経由地に登録</text>
<text x="500" y="1520" text-anchor="middle" class="s">登録地点と地図の印は入口ランプ座標</text>
</svg>
