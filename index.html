<script>

document.addEventListener(
"DOMContentLoaded",
function(){

var map_object = null;

for (var key in window){

if(
key.startsWith("map_")
&&
window[key] instanceof L.Map
){

map_object = window[key];
break;

}

}

if (!map_object){

alert("地図取得失敗");
return;

}

var currentMarker = null;

navigator.geolocation.watchPosition(

function(position){

var lat =
position.coords.latitude;

var lon =
position.coords.longitude;

var currentPos =
[lat,lon];

if(currentMarker == null){

currentMarker =
L.circleMarker(
currentPos,
{
radius:10,
fillColor:"#3388ff",
color:"#ffffff",
weight:3,
fillOpacity:1.0
}
).addTo(map_object);

}
else{

currentMarker.setLatLng(
currentPos
);

}

map_object.setView(
currentPos,
map_object.getZoom()
);

},

function(error){

console.log(error);

},

{
enableHighAccuracy:true,
maximumAge:1000,
timeout:10000
}

);

});

</script>
