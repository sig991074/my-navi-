<script>

document.addEventListener(
"DOMContentLoaded",
function(){

var map_object = null;

for (var key in window) {

if (
key.startsWith("map_")
&&
window[key] instanceof L.Map
) {

map_object = window[key];
break;

}

}

if (!map_object) {

alert("地図取得失敗");
return;

}

//
// 情報表示BOX
//

var infoBox =
document.createElement("div");

infoBox.style.position = "fixed";
infoBox.style.top = "10px";
infoBox.style.left = "10px";
infoBox.style.zIndex = "9999";
infoBox.style.background = "white";
infoBox.style.padding = "10px";
infoBox.style.border = "1px solid black";
infoBox.style.fontWeight = "bold";
infoBox.style.fontSize = "14px";

infoBox.innerHTML =
"残距離: --- km<br>ETA: --- 分";

document.body.appendChild(
infoBox
);

//
// 音声
//

function speak(text) {

if(
'speechSynthesis'
in window
) {

var utter =
new SpeechSynthesisUtterance(
text
);

utter.lang = 'ja-JP';

speechSynthesis.speak(
utter
);

}

}

//
// GPS
//

var currentMarker = null;

navigator.geolocation.watchPosition(

function(position){

var lat =
position.coords.latitude;

var lon =
position.coords.longitude;

var currentPos =
[lat,lon];

if(currentMarker == null){

currentMarker =
L.circleMarker(
currentPos,
{
radius:10,
fillColor:"#3388ff",
color:"#ffffff",
weight:3,
fillOpacity:1.0
}
).addTo(map_object);

}
else{

currentMarker.setLatLng(
currentPos
);

}

//
// 現在地追従
//

map_object.setView(
currentPos,
map_object.getZoom()
);

//
// 残距離計算
//

var R = 6371;

var dLat =
(34.9855 - lat)
*
Math.PI
/
180;

var dLon =
(135.7586 - lon)
*
Math.PI
/
180;

var a =

Math.sin(dLat/2)
*
Math.sin(dLat/2)

+

Math.cos(
lat*Math.PI/180
)

*

Math.cos(
34.9855*Math.PI/180
)

*

Math.sin(dLon/2)
*
Math.sin(dLon/2);

var c =

2 *
Math.atan2(
Math.sqrt(a),
Math.sqrt(1-a)
);

var distanceKm =
R * c;

//
// ETA
// 平均50km/h
//

var etaMin =
(distanceKm / 50)
*
60;

infoBox.innerHTML =

"残距離: "

+

distanceKm.toFixed(1)

+

" km<br>ETA: "

+

etaMin.toFixed(0)

+

" 分";

},

function(error){

console.log(error);

},

{
enableHighAccuracy:true,
maximumAge:1000,
timeout:10000
}

);

});

</script>
