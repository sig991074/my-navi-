<script>
    
    
            var map_45bc9a40da3dcdf2877aef086c072a6a = L.map(
                "map_45bc9a40da3dcdf2877aef086c072a6a",
                {
                    center: [35.6812, 139.7671],
                    crs: L.CRS.EPSG3857,
                    ...{
  "zoom": 14,
  "zoomControl": true,
  "preferCanvas": false,
}

                }
            );

            

        
    
            var tile_layer_3e4cbf2e0c2ac48774ccf96b416724fc = L.tileLayer(
                "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
                {
  "minZoom": 0,
  "maxZoom": 19,
  "maxNativeZoom": 19,
  "noWrap": false,
  "attribution": "\u0026copy; \u003ca href=\"https://www.openstreetmap.org/copyright\"\u003eOpenStreetMap\u003c/a\u003e contributors",
  "subdomains": "abc",
  "detectRetina": false,
  "tms": false,
  "opacity": 1,
}

            );
        
    
            tile_layer_3e4cbf2e0c2ac48774ccf96b416724fc.addTo(map_45bc9a40da3dcdf2877aef086c072a6a);
        
    
            var poly_line_85378870bc6fab8acfdb9ebbcca6388b = L.polyline(
                [[35.6812, 139.7671], [35.6667, 139.757], [35.655, 139.745], [35.6284, 139.7387]],
                {"bubblingMouseEvents": true, "color": "#FF3366", "dashArray": null, "dashOffset": null, "fill": false, "fillColor": "#FF3366", "fillOpacity": 0.2, "fillRule": "evenodd", "lineCap": "round", "lineJoin": "round", "noClip": false, "opacity": 0.8, "smoothFactor": 1.0, "stroke": true, "weight": 8}
            ).addTo(map_45bc9a40da3dcdf2877aef086c072a6a);
        
    
        (function(){
            var map_object = map_45bc9a40da3dcdf2877aef086c072a6a;
            
            // 現在地用の青い丸（初期位置）
            var currentPosMarker = L.circleMarker([35.6812, 139.7671], {
                radius: 10,
                fillColor: '#3388ff',
                color: '#fff',
                weight: 3,
                fillOpacity: 0.8
            }).addTo(map_object);

            // スマホのGPSと連動して画面中央に固定する命令
            if (navigator.geolocation) {
                navigator.geolocation.watchPosition(
                    function(position) {
                        var lat = position.coords.latitude;
                        var lng = position.coords.longitude;
                        var newPos = [lat, lng];

                        currentPosMarker.setLatLng(newPos);
                        map_object.setView(newPos, map_object.getZoom());
                    },
                    function(error) {
                        console.log("GPS信号を探しています...");
                    },
                    { enableHighAccuracy: true, maximumAge: 1000, timeout: 10000 }
                );
            }
        })();
        
</script>
