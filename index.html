 #ccc}.routeResult{margin:5px 0;border:1px solid #9bb;background:#f5fbfe}.routeResult b{color:#176fa7}#status{position:fixed;z-index:1100;left:10px;bottom:10px;width:270px;min-width:270px;max-width:270px;box-sizing:border-box;padding:9px 12px;background:#fff;border:2px solid #176fa7;border-radius:5px;font-size:12px;font-weight:bold;color:#163f56;pointer-events:none}.route-legend{display:none;position:absolute;z-index:1100;left:0;top:210px;width:max-content;max-width:calc(100% - 20px);box-sizing:border-box;background:#fff;border:1px solid #8297a3;border-radius:5px;padding:7px 8px;font-size:11px;box-shadow:0 4px 12px #0004}.route-legend.show{display:block}.route-legend span{display:flex;align-items:center;margin:0 0 6px 0}.route-legend span:last-child{margin-bottom:0}.route-legend i{display:inline-block;width:20px;height:5px;margin-right:7px}.roadSectionList{margin:4px 0 7px 12px;border-left:3px solid #8ba4b3;padding:4px 0 4px 9px}.roadSection{display:grid;grid-template-columns:10px 1fr auto;gap:6px;align-items:center;padding:5px 3px;border-bottom:1px dotted #c2ccd2;font-size:11px}.roadDot{width:9px;height:9px;border-radius:50%}.roadKm{font-weight:bold;white-space:nowrap}.roadType{font-size:9px;color:#607580}.roadEmpty{padding:7px;color:#687b87;font-size:11px}.icInfo{padding:7px;background:#fff8cf;border:1px solid #ceb95d;font-size:11px;margin:5px 0}

"true" data-code="B">B:無料高速</div><div class="condition-card" draggable="true" data-code="C">C:バイパス優先</div><div class="condition-card" draggable="true" data-code="D">D:一般国道優先</div><div class="condition-card" draggable="true" data-code="E">E:一般2車線優先</div><div class="condition-card" draggable="true" data-code="F">F:狭路回避 <select id="narrowWidth" style="width:58px" onclick="event.stopPropagation()"><option value="4">4m未満</option><option value="6">6m未満</option></select></div></div><div class="drag-note">↓　ドラッグする。</div></div><div><div class="route-box"><h4>ルート1（共通初期条件）</h4><div class="priority-row" id="route1"></div><div class="route-summary" id="summary1"></div><button class="tiny" data-clear="1">初期化</button></div><div class="route-box"><h4>ルート2（共通初期条件）</h4><div class="priority-row" id="route2"></div><div class="route-summary" id="summary2"></div><button class="tiny" data-clear="2">初期化</button></div></div></div></div></div><div class="menu"><div class="head">ルート<small id="rs">ルート1</small></div><div class="pop"><button data-r="1">ルート1</button><button data-r="2">ルート2</button></div></div><button id="routeCalc">ルート選定</button><div class="route-legend"><span><i style="background:#d32f2f"></i>高速</span><span><i style="background:#1976d2"></i>無料高速</span><span><i style="background:#2e9d50"></i>バイパス</span><span><i style="background:#f28c28"></i>国道</span><span><i style="background:#6f7780"></i>その他</span><span><i style="background:#ffd400"></i>狭路注意・幅員表示</span></div><div id="status">出発地と目的地を設定してください</div></section><aside id="right"><div id="rh">EV旅行プランナー</div><div id="sum"><div class="s">距離<b id="sumDistance">未計算</b></div><div class="s">時間<b id="sumTime">未計算</b></div><div class="s">料金<b>未設定</b></div><div class="s">電費<b>未計算</b></div><div class="s">残量<b>未計算</b></div></div><div id="list">登録地点はありません</div></aside></div><script>
const $=id=>document.getElementById(id);let map,kind='出発地',mode='A',pick=false,dragCode='',candidateMarkers=[],placeMarkers=[],routeLayers=[],selectedRoute=1,routePlans={1:{start:null,destination:null,vias:[]},2:{start:null,destination:null,vias:[]}},routeMeta=null;const defaults={1:['B','A','C','F','D','E'],2:['B','A','','','','']};let priorities={1:[...defaults[1]],2:[...defaults[2]]};
addEventListener('DOMContentLoaded',()=>{map=L.map('map').setView([34.85,135.78],10);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);bind();bindConditions();loadHistory();renderAll();renderPlaces()});
function clearSearch(){let q=$('q');q.value='';q.removeAttribute('list');q.dispatchEvent(new Event('input',{bubbles:true}));requestAnimationFrame(()=>{q.value='';q.setAttribute('list','searchHistory');q.focus();setTimeout(()=>q.value='',100)})}
function bind(){document.querySelectorAll('.head').forEach(h=>h.onclick=e=>{e.stopPropagation();let m=h.parentElement;document.querySelectorAll('.menu').forEach(x=>{if(x!==m)x.classList.remove('open')});m.classList.toggle('open');document.body.classList.toggle('menu-popup-open',!!document.querySelector('.menu.open'))});document.addEventListener('click',()=>{document.querySelectorAll('.menu').forEach(x=>x.classList.remove('open'));document.body.classList.remove('menu-popup-open')});document.querySelectorAll('.pop').forEach(p=>p.onclick=e=>e.stopPropagation());document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{$('vs').textContent=b.dataset.v});document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{kind=b.dataset.k;$('ks').textContent=kind;clearCandidates();clearSearch()});$('rs').ondblclick=e=>{e.preventDefault();e.stopPropagation();$('routeCalc').textContent='ルート決定';$('status').textContent='ルート'+selectedRoute+'を決定対象にしました'};document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{selectedRoute=+b.dataset.r;if(selectedRoute===2)copyCourse1EndpointsToCourse2();$('rs').textContent='ルート'+selectedRoute;$('routeCalc').textContent='ルート選定';updateRouteVisibility();drawMarkers();renderPlaces();$('status').textContent='ルート'+selectedRoute+'を選択しました'});$('mapPick').onclick=()=>{pick=true;map.getContainer().style.cursor='crosshair'};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&pick){pick=false;map.getContainer().style.cursor='';$('status').textContent='地図上から選択を解除しました';e.preventDefault()}});map.on('click',e=>{if(!pick)return;pick=false;map.getContainer().style.cursor='';let n=prompt('地点名',kind);if(n)setPlace({name:n,address:'地図上から設定',lat:e.latlng.lat,lon:e.latlng.lng})});$('gps').onclick=()=>navigator.geolocation?.getCurrentPosition(p=>setPlace({name:'現在地',address:'GPS',lat:p.coords.latitude,lon:p.coords.longitude}),()=>{$('status').textContent='GPS取得に失敗しました'});$('q').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();searchPlace()}};$(' function bindConditions(){document.querySelectorAll('.condition-card').forEach(c=>{c.ondragstart=e=>{if(e.target.tagName==='SELECT'){e.preventDefault();return}dragCode=c.dataset.code;c.classList.add('dragging');e.dataTransfer.setData('text/plain',dragCode)};c.ondragend=()=>c.classList.remove('dragging')});$('narrowWidth').onchange=()=>{$('status').textContent='狭路基準を'+$('narrowWidth').value+'m未満に変更しました'};document.querySelectorAll('[data-clear]').forEach(b=>b.onclick=()=>{let r=b.dataset.clear;priorities[r]=[...defaults[r]];renderAll()})}
function renderAll(){renderPriority(1);renderPriority(2);updateSummaries()}
function renderPriority(route){let box=$('route'+route);box.innerHTML='';for(let i=0;i<6;i++){let slot=document.createElement('div');slot.className='slot'+(priorities[route][i]?' filled':'');slot.textContent=priorities[route][i]||'';slot.draggable=!!priorities[route][i];slot.ondragstart=e=>{dragCode=slot.textContent;e.dataTransfer.setData('text/plain',dragCode);e.dataTransfer.setData('from',route+':'+i)};slot.ondragover=e=>{e.preventDefault();slot.classList.add('over')};slot.ondragleave=()=>slot.classList.remove('over');slot.ondrop=e=>{e.preventDefault();slot.classList.remove('over');placeCode(route,i,e.dataTransfer.getData('text/plain')||dragCode,e.dataTransfer.getData('from'))};slot.onclick=()=>{if(slot.textContent){priorities[route][i]='';compact(route);renderAll()}};box.appendChild(slot);if(i<5)box.appendChild(Object.assign(document.createElement('div'),{className:'sep',textContent:'≧'}))}box.appendChild(Object.assign(document.createElement('div'),{className:'sep',textContent:'≧'}));box.appendChild(Object.assign(document.createElement('div'),{className:'other',textContent:'その他'}))}
function placeCode(route,index,code,from){if(!/^[A-F]$/.test(code))return;let at=priorities[route].indexOf(code);if(at>=0)priorities[route][at]='';if(from){let [fr,fi]=from.split(':').map(Number);if(fr!==route)priorities[fr][fi]=''}priorities[route][index]=code;compact(route);if(from){let fr=+from.split(':')[0];if(fr!==route)compact(fr)}renderAll()}
function compact(r){priorities[r]=priorities[r].filter(Boolean);while(priorities[r].length<6)priorities[r].push('')}
function priorityText(r){return 'ルート'+r+' '+priorities[r].map(x=>x||'　').join(' ≧ ')+' ≧ その他'}
function updateSummaries(){$('summary1').textContent=priorityText(1);$('summary2').textContent=priorityText(2);$('cs').textContent=priorityText(1)}
async function fetchJsonTimeout(url,ms=15000){let c=new AbortController(),t=setTimeout(()=>c.abort(),ms);try{let r=await fetch(url,{signal:c.signal});if(!r.ok)throw Error('HTTP '+r.status);return await r.json()}finally{clearTimeout(t)}}
async function searchPlace(){let q=$('q').value.trim();if(!q)return;saveHistory(q);clearCandidates();$('status').textContent='検索中';let compact=q.replace(/[　\s・]/g,'');if(compact.includes('夕凪')){showCandidates([{name:'間人温泉郷 海辺の宿 夕凪',address:'京都府京丹後市丹後町間人4260',lat:35.7207448,lon:135.0795504}]);$('status').textContent='検索完了';return}let urls=['https://nominatim.openstreetmap.org/search?format=jsonv2&limit=12&countrycodes=jp&accept-language=ja&namedetails=1&q='+encodeURIComponent(q),'https://photon.komoot.io/api/?limit=12&lang=ja&q='+encodeURIComponent(q)];for(let i=0;i<urls.length;i++){try{let j=await fetchJsonTimeout(urls[i],12000),a=i===0?j.map(x=>({name:x.namedetails?.name||x.name||q,address:x.display_name,lat:+x.lat,lon:+x.lon})):(j.features||[]).map(x=>({name:x.properties?.name||q,address:[x.properties?.city,x.properties?.state,x.properties?.country].filter(Boolean).join(' '),lat:+x.geometry.coordinates[1],lon:+x.geometry.coordinates[0]}));if(a.length){showCandidates(a);$('status').textContent='検索完了';return}}catch(e){}}$('status').textContent='検索できませんでした。もう一度検索してください'}
function showCandidates(a){let box=$('candidates');box.innerHTML='';a.forEach((x,i)=>{let n=i+1,icon=L.divIcon({className:'',html:'<div class="searchpin">'+n+'</div>',iconSize:[24,24],iconAnchor:[12,12]}),m=L.marker([x.lat,x.lon],{icon}).addTo(map);candidateMarkers.push(m);let d=document.createElement('div');d.className='cand';d.innerHTML='<div class="num">'+n+'</div><div><b>'+esc(x.name)+'</b></div>';d.onclick=()=>setPlace(x);box.appendChild(d)});box.style.display=a.length?'block':'none';if(a.length)map.fitBounds(L.featureGroup(candidateMarkers).getBounds(),{padding:[40,40]})}
function setPlace(x){let plan=routePlans[selectedRoute],p={type:kind,name:x.name,address:x.address,lat:+x.lat,lon:+x.lon};if(kind==='出発地')plan.start=p;else if(kind==='目的地')plan.destination=p;else plan.vias.push(p);clearCandidates();drawMarkers();renderPlaces();map.setView([p.lat,p.lon],16);$('status').textContent='ルート'+selectedRoute+'に'+kind+'を設定しました'}
function rad(x){return x*Math.PI/180}function dist(a,b){let R=6371,dLat=rad(b.lat-a.lat),dLon=rad(b.lon-a.lon),v=Math.sin(dLat/2)**2+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dLon/2)**2;return 2*R*Math.asin(Math.sqrt(v))}function bearing(a,b){let y=Math.sin(rad(b.lon-a.lon))*Math.cos(rad(b.lat)),x=Math.cos(rad(a.lat))*Math.sin(rad(b.lat))-Math.sin(rad(a.lat))*Math.cos(rad(b.lat))*Math.cos(rad(b.lon-a.lon));return(Math.atan2(y,x)*180/Math.PI+360)%360}function angleDiff(a,b){let d=Math.abs(a-b)%360;return d>180?360-d:d}
async function findICs(p){let urls=['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter','https://overpass.nchc.org.tw/api/interpreter'];for(let radius of[10000,20000,40000,70000]){let query='[out:json][timeout:15];way(around:'+radius+','+p.lat+','+p.lon+')[highway=motorway_link];out center tags;';for(let base of urls){try{let controller=new AbortController(),timer=setTimeout(()=>controller.abort(),18000),r=await fetch(base+'?data='+encodeURIComponent(query),{signal:controller.signal});clearTimeout(timer);if(!r.ok)continue;let j=await r.json(),seen=new Set(),list=[];for(let x of(j.elements||[])){let c=x.center;if(!c)continue;let item={lat:c.lat,lon:c.lon,name:x.tags?.name||x.tags?.destination||x.tags?.ref||'高速入口ランプ',ref:x.tags?.ref||''},key=item.lat.toFixed(4)+','+item.lon.toFixed(4);if(seen.has(key))continue;seen.add(key);list.push(item)}list.sort((x,y)=>dist(p,x)-dist(p,y));if(list.length)return list.slice(0,6)}catch(e){}}}return[]}
function forwardPoint(p,dir,meters=800){let d=meters/111320,br=rad(dir);return{lat:p.lat+d*Math.cos(br),lon:p.lon+d*Math.sin(br)/Math.cos(rad(p.lat)),name:'進行方向確認点'}}
async function getRoute(points){let coords=points.map(p=>p.lon+','+p.lat).join(';'),u='https://router.project-osrm.org/route/v1/driving/'+coords+'?alternatives=false&overview=full&geometries=geojson&steps=true';let j=await(await fetch(u)).json();if(j.code!=='Ok'||!j.routes?.length)throw Error('NoRoute');let r=j.routes[0],steps=r.legs.flatMap(x=>x.steps||[]),motorway=steps.filter(s=>roadInfo(s).type==='高速道路'||roadInfo(s).type==='無料高速').reduce((n,s)=>n+s.distance,0),route27=steps.filter(s=>{let t=((s.name||'')+' '+(s.ref||'')).toLowerCase();return /(^|[^0-9])27([^0-9]|$)|国道27号/.test(t)}).reduce((n,s)=>n+s.distance,0);return{...r,steps,motorway,route27}}
async function getRoutes(points){let coords=points.map(p=>p.lon+','+p.lat).join(';'),u='https://router.project-osrm.org/route/v1/driving/'+coords+'?alternatives=2&overview=full&geometries=geojson&steps=true';let j=await(await fetch(u)).json();if(j.code!=='Ok'||!j.routes?.length)throw Error('NoRoute');return j.routes.slice(0,2).map(r=>{let steps=r.legs.flatMap(x=>x.steps||[]),motorway=steps.filter(s=>roadInfo(s).type==='高速道路'||roadInfo(s).type==='無料高速').reduce((n,s)=>n+s.distance,0),route27=steps.filter(s=>{let t=((s.name||'')+' '+(s.ref||'')).toLowerCase();return /(^|[^0-9])27([^0-9]|$)|国道27号/.test(t)}).reduce((n,s)=>n+s.distance,0);return{...r,steps,motorway,route27}})}
function copyCourse1EndpointsToCourse2(){let a=routePlans[1],b=routePlans[2];if(a.start)b.start={...a.start};if(a.destination)b.destination={...a.destination}}function updateRouteVisibility(){routeLayers.forEach(x=>{if(!map.hasLayer(x.layer))x.layer.addTo(map)})}
function narrowInfo(s){let i=roadInfo(s),text=((s.name||'')+' '+(s.ref||'')).toLowerCase(),limit=+$('narrowWidth').value||4;if(['高速道路','無料高速','バイパス'].includes(i.type))return null;let width=Number(s.width||s.annotation?.width||NaN);if(Number.isFinite(width)&&width<limit)return{label:'最低'+width.toFixed(1)+'m未満',known:true};let unnamed=!s.name||/道路名なし/.test(text),minor=/林道|農道|町道|村道|生活|住宅|細街路/.test(text);if(limit===4&&(unnamed||minor))return{label:'幅員不明・4m未満の疑い',known:false};if(limit===6&&(unnamed||minor||i.type==='その他'))return{label:'幅員不明・6m未満の疑い',known:false};return null}
function isNarrowStep(s){return!!narrowInfo(s)}
function routeMetric(r){let m={A:0,B:0,C:0,D:0,E:0,F:0};(r.steps||[]).forEach(s=>{let t=roadInfo(s).type,d=s.distance||0;if(t==='高速道路')m.A+=d;else if(t==='無料高速')m.B+=d;else if(t==='バイパス')m.C+=d;else if(t==='国道')m.D+=d;if(['高速道路','無料高速','バイパス','国道'].includes(t))m.E+=d;if(isNarrowStep(s))m.F+=d});return m}
function compareRoutes(a,b,routeNo){let pa=routeMetric(a),pb=routeMetric(b),order=priorities[routeNo].filter(Boolean);for(let code of order){let av=code==='F'?-pa.F:pa[code],bv=code==='F'?-pb.F:pb[code];if(Math.abs(av-bv)>50)return bv-av}return a.duration-b.duration}
async function calculateRoutes(routeNo=selectedRoute){if(routeNo===2)copyCourse1EndpointsToCourse2();let plan=routePlans[routeNo];if(!plan.start||!plan.destination){$('status').textContent='ルート'+routeNo+'の出発地と目的地を設定してください';return}$('status').textContent='ルート'+routeNo+'を計算しています';try{let points=[plan.start,...plan.vias,plan.destination],routes=await getRoutes(points);routes.sort((a,b)=>compareRoutes(a,b,routeNo));let route=routes[0];route.narrowWarning=(route.steps||[]).some(isNarrowStep);drawRoutes([route],routeNo);$('status').textContent='優先順でルート'+routeNo+'を抽出しました'+(route.narrowWarning?'（黄色は'+$('narrowWidth').value+'m未満の疑い）':'')}catch(e){$('status').textContent='ルート'+routeNo+'の計算エラー'}}
function roadInfo(s){let name=(s.name||'').trim(),ref=(s.ref||'').trim(),text=(name+' '+ref).toLowerCase();if(/(^|[\s;,])e\d+[a-z]?(?=$|[\s;,])/i.test(text))return{type:'高速道路',color:'#d32f2f'};if(/無料|新直轄/.test(text))return{type:'無料高速',color:'#1976d2'};if(/高速|自動車道|expressway|motorway/i.test(text))return{type:'高速道路',color:'#d32f2f'};if(/バイパス|bypass/i.test(text))return{type:'バイパス',color:'#2e9d50'};if(/国道|route\s*\d+/i.test(text)||/^r?\d+$/i.test(ref))return{type:'国道',color:'#f28c28'};return{type:'その他',color:'#6f7780'}}
function roadLabel(s){let r=(s.ref||'').trim(),n=(s.name||'').trim();if(/^e\d+/i.test(r))return r.toUpperCase();if(/^\d+$/.test(r))return'国道'+r+'号';return r||n||'道路名なし'}
function drawRoutes(routes,routeNo=selectedRoute){let old=routeLayers.find(x=>x.routeNo===routeNo);if(old)map.removeLayer(old.layer);routeLayers=routeLayers.filter(x=>x.routeNo!==routeNo);routes.forEach(r=>drawRoute(r,routeNo));updateRouteVisibility();if(routeLayers.length){let current=routeLayers.find(x=>x.routeNo===selectedRoute)||routeLayers.find(x=>x.routeNo===routeNo);if(current){map.fitBounds(current.layer.getBounds(),{padding:[35,35]});$('sumDistance').textContent=(current.distance/1000).toFixed(1)+'km';$('sumTime').textContent=formatDuration(current.duration)}}renderPlaces()}
function drawRoute(r,routeNo=1){let group=L.featureGroup().addTo(map),sections=[],infos=r.steps.map(s=>roadInfo(s));infos=infos.map((i,n)=>{if(i.type!=='その他'||r.steps[n].distance>3000)return i;let p=infos[n-1]?.type,q=infos[n+1]?.type;if(['高速道路','無料高速'].includes(p)||['高速道路','無料高速'].includes(q))return{type:p==='無料高速'||q==='無料高速'?'無料高速':'高速道路',color:p==='無料高速'||q==='無料高速'?'#1976d2':'#d32f2f'};return i});r.steps.forEach((s,n)=>{let i=infos[n],ni=narrowInfo(s);if(ni)i={type:'狭路注意',color:'#ffd400'};let label=roadLabel(s),last=sections.at(-1);if(last&&last.type===i.type&&last.label===label)last.distance+=s.distance;else sections.push({type:i.type,label,color:i.color,distance:s.distance});let c=s.geometry?.coordinates;if(c?.length>1){let pts=c.map(x=>[x[1],x[0]]);L.polyline(pts,{color:i.color,weight:routeNo===1?8:6,opacity:routeNo===1?.92:.72,dashArray:null}).addTo(group);L.polyline(pts,{color:'#000',weight:26,opacity:0,interactive:true}).on('mouseover',()=>document.querySelector('.route-legend')?.classList.add('show')).on('mouseout',()=>document.querySelector('.route-legend')?.classList.remove('show')).on('dblclick',e=>{L.DomEvent.stop(e);let n=prompt('経由地名','ルート'+routeNo+' 経由地');if(!n)return;routePlans[routeNo].vias.push({type:'経由地.その他',name:n,address:'ルート'+routeNo+'の経路線から追加',lat:e.latlng.lat,lon:e.latlng.lng});if(selectedRoute===routeNo)drawMarkers();renderPlaces();calculateRoutes(routeNo)}).addTo(group)}});let warningSteps=(r.steps||[]).filter(s=>isNarrowStep(s)&&s.geometry?.coordinates?.length>1).sort((a,b)=>(b.distance||0)-(a.distance||0)).slice(0,3);warningSteps.forEach((s,idx)=>{let c=s.geometry.coordinates,mid=c[Math.floor(c.length/2)],routePoint=L.latLng(mid[1],mid[0]),offset=idx%2===0?.018:-.018,labelPoint=L.latLng(routePoint.lat+offset,routePoint.lng+.025),ni=narrowInfo(s),label=ni?.label||'幅員不明・狭路注意';L.polyline([routePoint,labelPoint],{color:'#d8b400',weight:2,opacity:.95,interactive:false}).addTo(group);L.marker(labelPoint,{interactive:false,icon:L.divIcon({className:'narrow-callout',html:esc(label)+'<small>黄色区間・代替道路なし</small>',iconSize:null,iconAnchor:[0,18]})}).addTo(group)});routeLayers.push({routeNo,layer:group,roadSections:sections,distance:r.distance,duration:r.duration,motorway:r.motorway,route27:r.route27||0});try{let gc=r.geometry&&r.geometry.coordinates,mid=gc&&gc[Math.floor(gc.length/2)];if(mid){let routePoint=L.latLng(mid[1],mid[0]),labelPoint=L.latLng(routePoint.lat+(routeNo===1?.06:-.06),routePoint.lng+.08),namedSteps=(r.steps||[]).filter(x=>{let t=roadInfo(x).type,n=(x.name||'').trim();return n&&n!=='道路名なし'&&(t==='高速道路'||t==='無料高速')}).sort((a,b)=>b.distance-a.distance),routeName=(namedSteps[0]?.name||'').trim()||(r.steps||[]).map(x=>(x.name||'').trim()).find(x=>x&&x!=='道路名なし')||'採用経路',infoHtml='<b>'+(['','①','②'][routeNo]||routeNo)+' '+esc(routeName)+'</b>'+formatDuration(r.duration)+' '+(r.distance/1000).toFixed(1)+'km 料金未設定<div class="routeHint">経路線をダブルクリックで経由地追加</div>';L.polyline([routePoint,labelPoint],{color:'#176fa7',weight:2,opacity:.95,interactive:false}).addTo(group);L.marker(labelPoint,{interactive:false,icon:L.divIcon({className:'route-callout '+(routeNo===2?'route2':''),html:infoHtml,iconSize:null,iconAnchor:[0,18]})}).addTo(group)}}catch(_e){}}
function renderPlaces(){let plan=routePlans[selectedRoute],h='<div class="routeResult"><b>'+(['','①','②'][selectedRoute]||selectedRoute)+' 選択中</b></div>';if(plan.start)h+=placeHtml(plan.start);let current=routeLayers.find(x=>x.routeNo===selectedRoute),items=current?.roadSections||[];h+=items.length?'<div class="roadSectionList">'+items.map(x=>'<div class="roadSection"><i class="roadDot" style="background:'+x.color+'"></i><div><b>'+esc(x.label)+'</b><div class="roadType">'+x.type+'</div></div><span class="roadKm">'+(x.distance/1000).toFixed(1)+' km</span></div>').join('')+'</div>':'<div class="roadEmpty">道路区間は経路計算後に表示されます</div>';plan.vias.forEach(v=>h+=placeHtml(v));if(plan.destination)h+=placeHtml(plan.destination);routeLayers.filter(x=>x.routeNo===selectedRoute).forEach(x=>h+='<div class="routeResult"><b>'+(['','①','②'][x.routeNo]||x.routeNo)+'</b><br>距離 '+(x.distance/1000).toFixed(1)+' km　時間 '+formatDuration(x.duration)+'<br>高速区間 '+(x.motorway/1000).toFixed(1)+' km<br>国道27号 '+((x.route27||0)/1000).toFixed(1)+' km</div>');$('list').innerHTML=h}
function placeHtml(p){return'<div class="placeRow"><b>'+esc(p.type)+'</b>：'+esc(p.name)+'<div class="addr">'+esc(p.address||'')+'</div></div>'}function drawMarkers(){placeMarkers.forEach(m=>map.removeLayer(m));placeMarkers=[];let plan=routePlans[selectedRoute];[plan.start,...plan.vias,plan.destination].filter(Boolean).forEach(p=>placeMarkers.push(L.marker([p.lat,p.lon]).addTo(map)))}function formatDuration(s){let t=Math.round(s/60),h=Math.floor(t/60),m=t%60;return h?h+'時間'+m+'分':m+'分'}function getHistory(){try{return JSON.parse(localStorage.getItem('carNaviSearchHistory')||'[]')}catch(e){return[]}}function loadHistory(){$('searchHistory').innerHTML=getHistory().map(x=>'<option value="'+esc(x)+'"></option>').join('')}function saveHistory(q){let h=getHistory().filter(x=>x!==q);h.unshift(q);localStorage.setItem('carNaviSearchHistory',JSON.stringify(h.slice(0,20)));loadHistory()}function clearCandidates(){candidateMarkers.forEach(m=>map.removeLayer(m));candidateMarkers=[];$('candidates').style.display='none'}function esc(v){return String(v||'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')}
</script></body></html>
