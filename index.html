function renderPriority(route){let box=$('route'+route);box.innerHTML='';for(let i=0;i<6;i++){let slot=document.createElement('div');slot.className='slot'+(priorities[route][i]?' filled':'');slot.textContent=priorities[route][i]||'';slot.draggable=!!priorities[route][i];slot.ondragstart=e=>{dragCode=slot.textContent;e.dataTransfer.setData('text/plain',dragCode);e.dataTransfer.setData('from',route+':'+i)};slot.ondragover=e=>{e.preventDefault();slot.classList.add('over')};slot.ondragleave=()=>slot.classList.remove('over');slot.ondrop=e=>{e.preventDefault();slot.classList.remove('over');placeCode(route,i,e.dataTransfer.getData('text/plain')||dragCode,e.dataTransfer.getData('from'))};slot.onclick=()=>{if(slot.textContent){priorities[route][i]='';compact(route);renderAll()}};box.appendChild(slot);if(i<5)box.appendChild(Object.assign(document.createElement('div'),{className:'sep',textContent:'≧'}))}box.appendChild(Object.assign(document.createElement('div'),{className:'sep',textContent:'≧'}));box.appendChild(Object.assign(document.createElement('div'),{className:'other',textContent:'その他'}))}

function drawRoutes(routes,routeNo=selectedRoute){if(routeHoverNo===routeNo){routeHoverNo=0;$('routeInfoMini')?.classList.remove('show')}let oldLayers=routeLayers.filter(x=>x.routeNo===routeNo);oldLayers.forEach(x=>{if(map.hasLayer(x.layer))map.removeLayer(x.layer)});let keepCallouts=[];dynamicCallouts.forEach(c=>{if(c.routeNo===routeNo){(c.lines||[]).forEach(l=>{if(map.hasLayer(l))map.removeLayer(l)});if(c.marker&&map.hasLayer(c.marker))map.removeLayer(c.marker)}else keepCallouts.push(c)});dynamicCallouts=keepCallouts;routeLayers=routeLayers.filter(x=>x.routeNo!==routeNo);routes.forEach((r,i)=>drawRoute(r,routeNo,i===0));updateRouteVisibility();if(routeLayers.length){let current=routeLayers.find(x=>x.routeNo===selectedRoute)||routeLayers.find(x=>x.routeNo===routeNo);if(current){let rl=current.layer.getLayers().filter(x=>x instanceof L.Polyline&&x.options.interactive!==false&&!x._isCallout);let rb=rl.length?L.featureGroup(rl).getBounds():current.layer.getBounds();map.fitBounds(rb,{padding:[35,35]});$('sumDistance').textContent=(current.distance/1000).toFixed(1)+'km';$('sumTime').textContent=formatDuration(current.duration)}}renderPlaces()}
function drawRoute(r,routeNo=1,showCallout=true){let group=L.featureGroup().addTo(map),sections=[],infos=r.steps.map(s=>roadInfo(s));infos=infos.map((i,n)=>{if(i.type!=='その他'||r.steps[n].distance>3000)return i;let p=infos[n-1]?.type,q=infos[n+1]?.type;if(['高速道路','無料高速'].includes(p)||['高速道路','無料高速'].includes(q))return{type:p==='無料高速'||q==='無料高速'?'無料高速':'高速道路',color:p==='無料高速'||q==='無料高速'?'#1976d2':'#d32f2f'};return i});r.steps.forEach((s,n)=>{let i=infos[n],ni=narrowInfo(s);if(ni)i={type:'狭路注意',color:'#ffd400'};let label=roadLabel(s),last=sections.at(-1);if(last&&last.type===i.type&&last.label===label){last.distance+=s.distance;last.duration+=(s.duration||0)}else{let gc=s.geometry?.coordinates,mm=gc?.[Math.floor(gc.length/2)];sections.push({type:i.type,label,color:i.color,distance:s.distance,duration:s.duration||0,anchor:mm?[mm[1],mm[0]]:null})};let c=s.geometry?.coordinates;if(c?.length>1){let pts=c.map(x=>[x[1],x[0]]);let mainLine=L.polyline(pts,{className:'route-soft',color:i.color,weight:ni?11:(routeNo===1?8:6),opacity:ni?.95:(routeNo===1?.68:.56),dashArray:null}).addTo(group);if(ni)mainLine.bringToFront();if(!ni)L.polyline(pts,{color:'#fff',weight:(routeNo===1?2.4:1.8),opacity:.22,interactive:false}).addTo(group);L.polyline(pts,{color:'#000',weight:26,opacity:0,interactive:true}).on('mouseover',()=>{document.querySelector('.route-legend')?.classList.add('show');showRouteDetails(routeNo)}).on('mouseout',()=>{document.querySelector('.route-legend')?.classList.remove('show');hideRouteDetails(routeNo)}).on('click',()=>{routeHoverNo===routeNo?hideRouteDetails(routeNo,0):showRouteDetails(routeNo)}).on('dblclick',e=>{L.DomEvent.stop(e);let n=prompt('経由地名','ルート'+routeNo+' 経由地');if(!n)return;routePlans[routeNo].vias.push({type:'経由地.その他',name:n,address:'ルート'+routeNo+'の経路線から追加',lat:e.latlng.lat,lon:e.latlng.lng});if(selectedRoute===routeNo)drawMarkers();renderPlaces();calculateRoutes(routeNo)}).addTo(group)}});if(showCallout&&!dynamicCallouts.some(c=>c.routeNo===routeNo&&c.kind==='narrow')){let warningSteps=(r.steps||[]).filter(s=>isNarrowStep(s)&&s.geometry?.coordinates?.length>1).sort((a,b)=>(b.distance||0)-(a.distance||0));if(warningSteps.length){let step=warningSteps[0],c=step.geometry.coordinates,m=c[Math.floor(c.length/2)],anchor=L.latLng(m[1],m[0]),ni=narrowInfo(step),label=ni?.label||'最低幅 不明',marker=L.marker(anchor,{interactive:false,icon:L.divIcon({className:'narrow-callout',html:'<span class="caution-title">狭隘注意</span>'+esc(label)+(step.onewayConfirmed?'<small>一方通行</small>':''),iconSize:null,iconAnchor:[0,18]})}).addTo(group),line=L.polyline([anchor,anchor],{color:'#c6a500',weight:1,opacity:.8,interactive:false});line._isCallout=true;line.addTo(group);dynamicCallouts.push({routeNo,kind:'narrow',anchors:[anchor],marker,lines:[line],dx:35,dy:-35});setTimeout(refreshDynamicCallouts,0);}} if(showCallout){let major=sections.filter(x=>x.anchor&&x.label!=='道路名なし'&&x.duration>600).slice(0,10);major.forEach((x,idx)=>{let anchor=L.latLng(x.anchor[0],x.anchor[1]),side=idx%2===0?1:-1,labelPoint=L.latLng(anchor.lat+(idx%3-1)*.012,anchor.lng+side*.035),html='<b>'+esc(x.label)+'</b>'+(x.distance/1000).toFixed(1)+'km　'+formatDuration(x.duration),line=L.polyline([anchor,labelPoint],{color:x.color,weight:2,opacity:.9,interactive:false}).addTo(group);line._isCallout=true;let marker=L.marker(labelPoint,{interactive:false,icon:L.divIcon({className:'section-callout'+(routeNo===2?' route2':''),html,iconSize:null,iconAnchor:[65,14]})}).addTo(group);let sectionCallout={routeNo,kind:'section',anchors:[anchor],marker,lines:[line]};dynamicCallouts.push(sectionCallout);setCalloutVisible(sectionCallout,false)});setTimeout(refreshDynamicCallouts,0)}
 routeLayers.push({routeNo,route:r,layer:group,roadSections:sections,distance:r.distance,duration:r.duration,motorway:r.motorway,route27:r.route27||0});try{let gc=r.geometry&&r.geometry.coordinates,mid=gc&&gc[Math.floor(gc.length/2)];if(mid){let routePoint=L.latLng(mid[1],mid[0]),labelPoint=L.latLng(routePoint.lat+(routeNo===1?.06:-.06),routePoint.lng+.08),namedSteps=(r.steps||[]).filter(x=>{let t=roadInfo(x).type,n=(x.name||'').trim();return n&&n!=='道路名なし'&&(t==='高速道路'||t==='無料高速')}).sort((a,b)=>b.distance-a.distance),routeName=(namedSteps[0]?.name||'').trim()||(r.steps||[]).map(x=>(x.name||'').trim()).find(x=>x&&x!=='道路名なし')||'採用経路',infoHtml='<b>'+(['','①','②'][routeNo]||routeNo)+' '+esc(routeName)+'</b>'+formatDuration(r.duration)+' '+(r.distance/1000).toFixed(1)+'km 料金未設定<div class="routeHint">経路線をダブルクリックで経由地追加</div>';let guideLine=L.polyline([routePoint,labelPoint],{color:routeNo===1?'#176fa7':'#f28c28',weight:2,opacity:.95,interactive:false}).addTo(group);guideLine._isCallout=true;let guideMarker=L.marker(labelPoint,{interactive:false,icon:L.divIcon({className:'route-callout '+(routeNo===2?'route2':''),html:infoHtml,iconSize:null,iconAnchor:[88,29]})}).addTo(group);dynamicCallouts.push({routeNo,kind:'main',anchors:[routePoint],marker:guideMarker,lines:[guideLine],dx:routeNo===1?90:-190,dy:routeNo===1?-85:85});setTimeout(refreshDynamicCallouts,0)}}catch(_e){}}
function renderPlaces(){let plan=routePlans[selectedRoute],h='<div class="routeResult"><b>'+(['','①','②'][selectedRoute]||selectedRoute)+' 選択中</b></div>';if(plan.start)h+=placeHtml(plan.start);let current=routeLayers.find(x=>x.routeNo===selectedRoute),items=current?.roadSections||[];h+=items.length?'<div class="roadSectionList">'+items.map(x=>'<div class="roadSection"><i class="roadDot" style="background:'+x.color+'"></i><div><b>'+esc(x.label)+'</b><div class="roadType">'+x.type+'</div></div><span class="roadKm">'+(x.distance/1000).toFixed(1)+' km</span></div>').join('')+'</div>':'<div class="roadEmpty">道路区間は経路計算後に表示されます</div>';plan.vias.forEach(v=>h+=placeHtml(v));if(plan.destination)h+=placeHtml(plan.destination);routeLayers.filter(x=>x.routeNo===selectedRoute).forEach(x=>h+='<div class="routeResult"><b>'+(['','①','②'][x.routeNo]||x.routeNo)+'</b><br>距離 '+(x.distance/1000).toFixed(1)+' km　時間 '+formatDuration(x.duration)+'<br>高速区間 '+(x.motorway/1000).toFixed(1)+' km<br>国道27号 '+((x.route27||0)/1000).toFixed(1)+' km</div>');$('list').innerHTML=h}
function placeHtml(p){return'<div class="placeRow"><b>'+esc(p.type)+'</b>：'+esc(p.name)+'<div class="addr">'+esc(p.address||'')+'</div></div>'}function drawMarkers(){placeMarkers.forEach(m=>map.removeLayer(m));placeMarkers=[];let plan=routePlans[selectedRoute];if(plan.start)placeMarkers.push(L.marker([plan.start.lat,plan.start.lon]).addTo(map));plan.vias.forEach((p,i)=>{let labels=['①','②','③','④','⑤','⑥','⑦','⑧','⑨'],icon=L.divIcon({className:'',html:'<div class="point-label"><span class="pin"></span><span class="tag">'+(labels[i]||i+1)+'</span></div>',iconSize:[54,26],iconAnchor:[11,25]});placeMarkers.push(L.marker([p.lat,p.lon],{icon}).addTo(map))});if(plan.destination){let icon=L.divIcon({className:'',html:'<div class="point-label"><span class="pin"></span><span class="tag">G</span></div>',iconSize:[54,26],iconAnchor:[11,25]});placeMarkers.push(L.marker([plan.destination.lat,plan.destination.lon],{icon}).addTo(map))}}function formatDuration(s){let t=Math.round(s/60),h=Math.floor(t/60),m=t%60;return h?h+'時間'+m+'分':m+'分'}function getHistory(){try{return JSON.parse(localStorage.getItem('carNaviSearchHistory')||'[]')}catch(e){return[]}}function loadHistory(){$('searchHistory').innerHTML=getHistory().map(x=>'<option value="'+esc(x)+'"></option>').join('')}function saveHistory(q){let h=getHistory().filter(x=>x!==q);h.unshift(q);localStorage.setItem('carNaviSearchHistory',JSON.stringify(h.slice(0,20)));loadHistory()}function clearCandidates(){candidateMarkers.forEach(m=>map.removeLayer(m));candidateMarkers=[];$('candidates').style.display='none'}function esc(v){return String(v||'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')}
</script><script>window.evNarrowRoadBridge={getMap:()=>map,getRouteLayers:()=>routeLayers,getDimensions:()=>trolleyDimensions(),isExclusionActive:routeNo=>priorities[routeNo]?.includes('F')};</script><script src="./narrow-road-overlay.js"></script></body></html>
