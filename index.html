<script>

document.addEventListener("DOMContentLoaded", function() {

var map_object = null;

for (var key in window) {

if (
key.startsWith("map_")
&&
window[key] instanceof L.Map
) {

map_object = window[key];
break;

}

}

if (!map_object) {

alert("地図取得失敗");
return;

}

var currentPosMarker = L.circleMarker(
[35.6812,139.7671],
{
radius:10,
fillColor:"#3388ff",
color:"#ffffff",
weight:3,
fillOpacity:0.8
}
).addTo(map_object);

navigator.geolocation.watchPosition(

function(position){

var lat = position.coords.latitude;
var lng = position.coords.longitude;

var newPos = [lat,lng];

currentPosMarker.setLatLng(newPos);

// map_object.setView(
// newPos,
// map_object.getZoom()
// );

},

function(error){

console.log(error);

},

{
enableHighAccuracy:true,
maximumAge:1000,
timeout:10000
}

);

});

</script>
