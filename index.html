<script>

document.addEventListener("DOMContentLoaded", function() {

var map_object = null;

for (var key in window) {

if (
key.startsWith("map_")
&&
window[key] instanceof L.Map
) {

map_object = window[key];
break;

}

}

if (!map_object) {
alert("地図取得失敗");
return;
}

var currentMarker = null;

var destinationMarker = L.marker(
[34.9855,135.7586]
).addTo(map_object);

var routeLine = null;

navigator.geolocation.watchPosition(

function(position) {

var lat =
position.coords.latitude;

var lon =
position.coords.longitude;

var currentPos =
[lat,lon];

if(currentMarker == null) {

currentMarker =
L.circleMarker(
currentPos,
{
radius:10,
fillColor:"#3388ff",
color:"#ffffff",
weight:3,
fillOpacity:0.9
}
).addTo(map_object);

}
else {

currentMarker.setLatLng(
currentPos
);

}

var osrmUrl =
"https://router.project-osrm.org/route/v1/driving/"
+
lon + "," + lat
+
";"
+
135.7586 + "," + 34.9855
+
"?overview=full&geometries=geojson";

fetch(osrmUrl)

.then(response => response.json())

.then(data => {

if(
data.routes &&
data.routes.length > 0
) {

var coords =
data.routes[0]
.geometry
.coordinates;

var leafletCoords =
coords.map(function(c){
return [c[1],c[0]];
});

if(routeLine){
map_object.removeLayer(routeLine);
}

routeLine =
L.polyline(
leafletCoords,
{
color:"red",
weight:8
}
).addTo(map_object);

}

});

//
// 現在地追従
//
map_object.setView(
currentPos,
15
);

},

function(error){
console.log(error);
},

{
enableHighAccuracy:true,
maximumAge:1000,
timeout:10000
}

);

});

</script>
