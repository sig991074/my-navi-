    html, body { height: 100%; margin: 0; padding: 0; }
    #map { position: absolute; top: 0; bottom: 0; right: 0; left: 0; }
    .distance-info {

<body>

</body>
<script>
    
    
            var map_71cfa4c3a302cf9a55f87b6e5a444542 = L.map(
                "map_71cfa4c3a302cf9a55f87b6e5a444542",
                {
                    center: [35.6812, 139.7671],
                    crs: L.CRS.EPSG3857,
                    ...{
  "zoom": 14,
  "zoomControl": false,
  "preferCanvas": false,
}

                }
            );

            

        
    
            var tile_layer_333d51fd54fbb90af5af6db007cdf07a = L.tileLayer(
                "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
                {
  "minZoom": 0,
  "maxZoom": 19,
  "maxNativeZoom": 19,
  "noWrap": false,
  "attribution": "\u0026copy; \u003ca href=\"https://www.openstreetmap.org/copyright\"\u003eOpenStreetMap\u003c/a\u003e contributors",
  "subdomains": "abc",
  "detectRetina": false,
  "tms": false,
  "opacity": 1,
}

            );
        
    
            tile_layer_333d51fd54fbb90af5af6db007cdf07a.addTo(map_71cfa4c3a302cf9a55f87b6e5a444542);
        
    
var map_object = figure_84e7a8233c202e79f118b77383aba4fa;

// ルート線をグローバル変数に保持
window.routeGeneral = L.polyline([[35.6812, 139.7671], [35.6667, 139.757], [35.655, 139.745], [35.6284, 139.7387]], {color: 'blue', weight: 8});
window.routeFreeHW = L.polyline([[35.6812, 139.7671], [35.67, 139.75], [35.64, 139.74], [35.6284, 139.7387]], {color: 'green', weight: 8});
window.routePaidHW = L.polyline([[35.6812, 139.7671], [35.675, 139.76], [35.65, 139.745], [35.6284, 139.7387]], {color: 'red', weight: 8});

var generalLayer = L.layerGroup([window.routeGeneral]);
var freeHWLayer = L.layerGroup([window.routeFreeHW]);
var paidHWLayer = L.layerGroup([window.routePaidHW]);

generalLayer.addTo(map_object);
window.activeRouteLine = window.routeGeneral;

var overlayMaps = {
    "一般道ルート": generalLayer,
    "無料高速ルート": freeHWLayer,
    "有料高速ルート": paidHWLayer
};
window.activeRouteLine = window.routeGeneral;

map_object.on('overlayadd', function(e) {
    if (e.name === "一般道ルート") window.activeRouteLine = window.routeGeneral;
    if (e.name === "無料高速ルート") window.activeRouteLine = window.routeFreeHW;
    if (e.name === "有料高速ルート") window.activeRouteLine = window.routePaidHW;
});

L.control.layers(null, overlayMaps).addTo(map_object);

// 現在地マーカー
window.currentMarker = null;

// 音声案内関数（室内強化）
function speak(text) {
    if ('speechSynthesis' in window) {
        var utter = new SpeechSynthesisUtterance(text);
        utter.lang = 'ja-JP';
        utter.volume = 1.0; // 最大音量
        utter.rate = 0.9;   // 少しゆっくり
        utter.pitch = 1.0;  // 標準高さ
        speechSynthesis.speak(utter);
    }
}

// GPS更新時にルート再描画 + 音声案内
if (navigator.geolocation) {
    navigator.geolocation.watchPosition(
        function(pos) {
            var lat = pos.coords.latitude;
            var lng = pos.coords.longitude;
            if (!window.currentMarker) {
                window.currentMarker = L.marker([lat, lng]).addTo(map_object);
                speak("ナビを開始します。ルートに沿って進んでください。");
            } else {
                window.currentMarker.setLatLng([lat, lng]);
                speak("現在地を更新しました。ルートを進んでください。");
            }
            if (window.activeRouteLine) {
                window.activeRouteLine.addTo(map_object);
            }
        },
        function(err) {
            console.error("位置情報取得エラー:", err);
            speak("位置情報が取得できません。設定を確認してください。");
        },
        { enableHighAccuracy: true }
    );
} else {
    alert("このブラウザは位置情報取得に対応していません。");
    speak("このブラウザは位置情報取得に対応していません。");
}

// 地図移動後にもルート再描画
map_object.on('moveend', function() {
    if (window.activeRouteLine) {
        window.activeRouteLine.addTo(map_object);
        speak("地図を移動しました。ルートを再表示します。");
    }
});
</script>
</html>
