<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-labelledby="title desc">
  <title id="title">利用者が選ぶクラウドで旅行プランを共有するイメージ</title>
  <desc id="desc">PCとスマートフォンがGitHub Pagesの旅行プラン画面を開き、各利用者が使うクラウドサービスに接続してプランを一覧、読み込み、新規登録、更新する構想図。Google DriveやOneDriveなど選んだサービスで保存する。</desc>
  <defs>
    <marker id="blueArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#31566d"/>
    </marker>
    <marker id="greenArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#25834a"/>
    </marker>
    <marker id="greenStart" markerWidth="12" markerHeight="12" refX="2" refY="6" orient="auto">
      <path d="M12 0L0 6L12 12Z" fill="#25834a"/>
    </marker>
    <style>
      text{font-family:Meiryo,"Yu Gothic",sans-serif;fill:#17384b}
      .title{font-size:30px;font-weight:700}
      .heading{font-size:21px;font-weight:700}
      .label{font-size:17px}
      .small{font-size:14px}
      .tiny{font-size:12px}
      .arrow{fill:none;stroke:#31566d;stroke-width:3;marker-end:url(#blueArrow)}
      .sync{fill:none;stroke:#25834a;stroke-width:4;marker-start:url(#greenStart);marker-end:url(#greenArrow)}
      .thin{fill:none;stroke:#7495aa;stroke-width:2}
    </style>
  </defs>
  <rect width="1440" height="1000" fill="#f1f3f4"/>
  <text x="60" y="58" class="title">旅行プランを共有して、外出先でも編集</text>
  <text x="62" y="88" class="small">構想図：PCは自宅に置いたまま、スマートフォンから同じプランを呼び出して変更</text>

  <!-- Browser app -->
  <g>
    <rect x="505" y="126" width="420" height="276" rx="18" fill="#fff7df" stroke="#31566d" stroke-width="4"/>
    <path d="M548 126H882Q848 154 882 183H548Q514 154 548 126Z" fill="#ffe9a8" stroke="#31566d" stroke-width="3"/>
    <circle cx="552" cy="151" r="5" fill="#e2715b"/>
    <circle cx="570" cy="151" r="5" fill="#e3bd51"/>
    <circle cx="588" cy="151" r="5" fill="#71a878"/>
    <text x="710" y="178" text-anchor="middle" class="heading">Web画面</text>
    <rect x="535" y="202" width="360" height="169" rx="8" fill="#fff" stroke="#9bb4c3" stroke-width="2"/>
    <rect x="547" y="214" width="336" height="34" rx="5" fill="#dcecf7"/>
    <text x="715" y="237" text-anchor="middle" class="small" font-weight="700">基礎データ入力</text>
    <text x="557" y="272" class="tiny">プラン名</text>
    <rect x="557" y="279" width="310" height="28" rx="4" fill="#fff" stroke="#8da5b3"/>
    <text x="568" y="298" class="tiny">和歌山の旅</text>
    <path d="M839 288l9 9 9-9" fill="none" stroke="#31566d" stroke-width="3"/>
    <rect x="557" y="317" width="310" height="38" rx="5" fill="#e8f2df" stroke="#7ba36f"/>
    <text x="712" y="342" text-anchor="middle" class="tiny">プラン一覧　　新規登録　　変更を保存</text>
    <text x="715" y="390" text-anchor="middle" class="tiny">GitHub Pagesから画面を表示</text>
  </g>

  <!-- GitHub source / hosting -->
  <g>
    <circle cx="1180" cy="213" r="66" fill="#fff" stroke="#526777" stroke-width="3"/>
    <path d="M1180 164c-28 0-50 22-50 50 0 22 14 41 34 48 2 0 3-1 3-3v-9c-14 3-17-6-17-6-2-6-6-8-6-8-5-4 1-4 1-4 6 0 9 6 9 6 5 8 12 6 15 5 0-3 2-6 3-7-11-1-23-6-23-25 0-6 2-11 6-15-1-2-3-8 1-15 0 0 5-2 16 6a54 54 0 0 1 29 0c11-8 16-6 16-6 4 7 2 13 1 15 4 4 6 9 6 15 0 19-12 24-23 25 2 2 4 5 4 10v13c0 2 1 3 3 3 20-7 34-26 34-48 0-28-22-50-50-50Z" fill="#28313b" transform="translate(0 0) scale(.9) translate(131 24)"/>
    <text x="1180" y="299" text-anchor="middle" class="label" font-weight="700">GitHub</text>
    <text x="1180" y="320" text-anchor="middle" class="tiny">Web画面を公開</text>
    <path d="M1112 213H930" class="arrow"/>
    <text x="1020" y="196" text-anchor="middle" class="tiny">画面を配信</text>
  </g>

  <!-- PC illustration -->
  <g>
    <rect x="75" y="231" width="270" height="178" rx="13" fill="#568fc1" stroke="#31566d" stroke-width="3"/>
    <rect x="91" y="247" width="238" height="142" rx="5" fill="#eef7fc"/>
    <rect x="103" y="259" width="214" height="25" rx="4" fill="#cfe4f3"/>
    <text x="210" y="277" text-anchor="middle" class="tiny" font-weight="700">旅行プランナー</text>
    <rect x="105" y="296" width="88" height="77" rx="5" fill="#dcebd7" stroke="#91ae86"/>
    <text x="149" y="326" text-anchor="middle" class="tiny">基礎データ</text>
    <text x="149" y="346" text-anchor="middle" class="tiny">ルート作成</text>
    <rect x="204" y="296" width="111" height="77" rx="5" fill="#fff" stroke="#a7b7c0"/>
    <path d="M217 355l24-31 18 16 19-24 24 39" fill="none" stroke="#62a36a" stroke-width="4"/>
    <path d="M187 410h47l27 24H161Z" fill="#8da7b5" stroke="#526d7e" stroke-width="2"/>
    <text x="210" y="469" text-anchor="middle" class="heading">自宅のPC</text>
    <text x="210" y="491" text-anchor="middle" class="small">同じWeb画面を使う</text>
  </g>
  <path d="M345 319H500" class="arrow"/>
  <text x="421" y="300" text-anchor="middle" class="tiny">ブラウザーで開く</text>

  <!-- Smartphone illustration -->
  <g>
    <rect x="1005" y="360" width="157" height="287" rx="25" fill="#344f60" stroke="#203945" stroke-width="3"/>
    <rect x="1017" y="387" width="133" height="225" rx="9" fill="#f7fbfd"/>
    <rect x="1017" y="387" width="133" height="31" rx="8" fill="#dcecf7"/>
    <text x="1083" y="407" text-anchor="middle" class="tiny" font-weight="700">基礎データ</text>
    <text x="1028" y="441" class="tiny">プラン名</text>
    <rect x="1027" y="449" width="113" height="28" rx="4" fill="#fff" stroke="#8da5b3"/>
    <text x="1034" y="467" class="tiny">和歌山の旅</text>
    <path d="M1119 458l6 6 6-6" fill="none" stroke="#31566d" stroke-width="2"/>
    <rect x="1028" y="487" width="111" height="42" rx="5" fill="#e8f2df" stroke="#7ba36f"/>
    <text x="1083" y="505" text-anchor="middle" class="tiny">既存プラン</text>
    <text x="1083" y="520" text-anchor="middle" class="tiny">新規・保存</text>
    <rect x="1037" y="541" width="93" height="43" rx="5" fill="#e6f2fa" stroke="#8da5b3"/>
    <text x="1083" y="568" text-anchor="middle" class="tiny">地図・経路</text>
    <circle cx="1083" cy="629" r="7" fill="#9fb1ba"/>
    <text x="1083" y="679" text-anchor="middle" class="heading">スマートフォン</text>
    <text x="1083" y="702" text-anchor="middle" class="small">出先で変更・保存</text>
  </g>
  <path d="M925 340C965 353 981 403 1004 440" class="arrow"/>
  <text x="964" y="385" text-anchor="middle" class="tiny">同じ画面</text>

  <!-- User-selected cloud storage -->
  <g>
    <path d="M607 483h170l26 29h152v178H607Z" fill="#70a9d5" stroke="#31566d" stroke-width="3"/>
    <path d="M607 512h348v178H607Z" fill="#8dbce0" stroke="#31566d" stroke-width="3"/>
    <path d="M607 528h348v20H607Z" fill="#6ba4d1"/>
    <text x="781" y="574" text-anchor="middle" class="heading" fill="#fff">自分のクラウド保存先</text>
    <rect x="647" y="590" width="268" height="32" rx="5" fill="#fff" stroke="#678ca5"/>
    <path d="M659 599h14l5 5h19v15h-38Z" fill="#73a9d3"/>
    <text x="806" y="611" text-anchor="middle" class="tiny">旅行プラン フォルダー</text>
    <rect x="647" y="630" width="268" height="25" rx="4" fill="#f7fbfd"/>
    <text x="781" y="647" text-anchor="middle" class="tiny">Google Drive　｜　OneDrive　｜　ほか</text>
    <text x="781" y="718" text-anchor="middle" class="heading">利用者がサービスを選択</text>
    <text x="781" y="741" text-anchor="middle" class="small">同じサービスへ接続した端末間で共有</text>
  </g>
  <path d="M781 402V476" class="sync"/>
  <text x="800" y="447" class="tiny">プランを保存・呼び出す</text>
  <path d="M1005 554C985 575 976 584 959 588" class="sync"/>
  <text x="983" y="617" text-anchor="middle" class="tiny">同じ共有先へ</text>

  <!-- Account authorization -->
  <g>
    <rect x="378" y="560" width="176" height="111" rx="14" fill="#fff" stroke="#7a93a3" stroke-width="2"/>
    <circle cx="419" cy="606" r="20" fill="#e5f1fa" stroke="#5286b5" stroke-width="2"/>
    <circle cx="419" cy="600" r="7" fill="#5286b5"/>
    <path d="M405 619q14-17 28 0" fill="#5286b5"/>
    <text x="482" y="600" class="small" font-weight="700">自分のアカウント</text>
    <text x="482" y="622" class="small" font-weight="700">でサインイン</text>
    <text x="466" y="660" text-anchor="middle" class="tiny">選んだサービスへ接続</text>
  </g>
  <path d="M554 614H603" class="arrow"/>
  <rect x="365" y="700" width="209" height="55" rx="10" fill="#fff5d9" stroke="#d4ad47" stroke-width="2"/>
  <text x="469" y="723" text-anchor="middle" class="tiny" font-weight="700">共有フォルダーに</text>
  <text x="469" y="742" text-anchor="middle" class="tiny">編集権限が必要</text>

  <!-- iCloud manual workflow -->
  <rect x="55" y="785" width="1330" height="185" rx="17" fill="#fff" stroke="#a8bac4" stroke-width="2"/>
  <text x="82" y="822" class="heading">iCloudの場合：端末のアプリでファイルを開いて編集</text>

  <g>
    <rect x="92" y="845" width="127" height="89" rx="12" fill="#4a718b" stroke="#294e65" stroke-width="2"/>
    <rect x="101" y="854" width="109" height="68" rx="5" fill="#edf8ff"/>
    <circle cx="155" cy="928" r="3" fill="#cfdae0"/>
    <text x="155" y="884" text-anchor="middle" class="tiny" font-weight="700">iPhone / iPad</text>
    <text x="155" y="904" text-anchor="middle" class="tiny">ファイルを選ぶ</text>
    <text x="155" y="958" text-anchor="middle" class="tiny">「ファイル」アプリ</text>
  </g>
  <path d="M223 889H304" class="arrow"/>
  <text x="263" y="870" text-anchor="middle" class="tiny">手動で選ぶ</text>
  <g>
    <path d="M323 864h52l13 14h82v57H323Z" fill="#dceafa" stroke="#6689a5" stroke-width="2"/>
    <text x="397" y="904" text-anchor="middle" class="small" font-weight="700">共有ファイル</text>
    <text x="397" y="925" text-anchor="middle" class="tiny">開いて編集・保存</text>
  </g>

  <g>
    <rect x="533" y="850" width="210" height="86" rx="10" fill="#eef4f8" stroke="#829aa9" stroke-width="2"/>
    <rect x="545" y="861" width="186" height="21" rx="4" fill="#d8e7f1"/>
    <text x="638" y="876" text-anchor="middle" class="tiny">icloud.com</text>
    <text x="638" y="905" text-anchor="middle" class="small" font-weight="700">Web版 iCloud</text>
    <text x="638" y="925" text-anchor="middle" class="tiny">一覧からファイルを開く</text>
  </g>
  <path d="M743 893H817" class="arrow"/>
  <text x="780" y="873" text-anchor="middle" class="tiny">手動で開く</text>
  <g>
    <path d="M836 864h52l13 14h82v57H836Z" fill="#dceafa" stroke="#6689a5" stroke-width="2"/>
    <text x="910" y="904" text-anchor="middle" class="small" font-weight="700">共有ファイル</text>
    <text x="910" y="925" text-anchor="middle" class="tiny">開いて編集・保存</text>
  </g>

  <path d="M1040 837V949" stroke="#d5dfe5" stroke-width="2"/>
  <circle cx="1080" cy="872" r="20" fill="#ffebe9" stroke="#c4544c" stroke-width="2"/>
  <path d="M1072 864l16 16m0-16l-16 16" stroke="#b53b34" stroke-width="4"/>
  <text x="1114" y="870" class="small" font-weight="700">iCloud Driveは、このアプリから</text>
  <text x="1114" y="892" class="small" font-weight="700">自動で一覧・新規作成・更新できません。</text>
  <text x="1114" y="922" class="tiny">共有ファイルは「ファイル」アプリまたはiCloud.comで操作します。</text>
  <text x="1114" y="944" class="tiny">iCloudは端末の「ファイル」アプリまたはiCloud.comで操作します。</text>
</svg>
