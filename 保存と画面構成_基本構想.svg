<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-labelledby="title desc">
  <title id="title">CARナビの画面構成と旅行データ保存の基本構想</title>
  <desc id="desc">現在の保存状況と提案する総合メニュー、共通旅行データ、選択したクラウド保存先URLへの自動上書き、オフライン時の状態表示を分けて示す。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#31566d"/>
    </marker>
    <marker id="greenArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#24834a"/>
    </marker>
    <style>
      text{font-family:Meiryo,"Yu Gothic",sans-serif;fill:#17384b}
      .title{font-size:30px;font-weight:700}
      .head{font-size:21px;font-weight:700}
      .body{font-size:17px}
      .small{font-size:14px}
      .tiny{font-size:12px}
      .box{fill:#fff;stroke:#8ba4b3;stroke-width:2}
      .line{fill:none;stroke:#31566d;stroke-width:3;marker-end:url(#arrow)}
      .saveLine{fill:none;stroke:#24834a;stroke-width:3;marker-end:url(#greenArrow)}
    </style>
  </defs>
  <rect width="1440" height="1000" fill="#f3f7f9"/>
  <text x="48" y="54" class="title">CARナビの画面構成と旅行データ保存（基本構想）</text>
  <text x="50" y="84" class="body">狭隘道路チェックは調査用シミュレーション。旅行計画の本体データは共通で扱い、終了後はメニューへ戻ります。</text>

  <rect x="50" y="112" width="1340" height="120" rx="14" fill="#fff2f0" stroke="#d66b62" stroke-width="2"/>
  <text x="78" y="148" class="head" fill="#9f2822">現在の確認結果</text>
  <text x="80" y="183" class="body">・旅行計画（出発地・経由地・目的地）の自動保存／クラウド保存は、現行ページでは確認できません。</text>
  <text x="80" y="211" class="body">・検索履歴や一部の設定値は端末内に保存されます。これは旅行計画の保存とは別です。</text>
  <text x="80" y="229" class="small">・過去の旅行データが消えたと確認したわけではありません。保存場所を調べていないため、残存状況は未確認です。</text>

  <text x="52" y="277" class="head">提案する動き</text>
  <text x="280" y="277" class="small">提案段階・まだ実装されていません</text>

  <rect x="65" y="306" width="250" height="88" rx="14" fill="#e6f2df" stroke="#7ba36f" stroke-width="2"/>
  <text x="190" y="341" text-anchor="middle" class="head">総合メニュー</text>
  <text x="190" y="370" text-anchor="middle" class="small">旅行を選ぶ・新規作成</text>

  <path d="M315 350H375" class="line"/>
  <rect x="390" y="292" width="340" height="105" rx="14" fill="#e8f2fb" stroke="#6d9bc0" stroke-width="2"/>
  <text x="560" y="329" text-anchor="middle" class="head">CARナビ ルートプランナー</text>
  <text x="560" y="360" text-anchor="middle" class="body">本来の旅行ルートを作成・編集</text>
  <text x="560" y="383" text-anchor="middle" class="small">元ルート／経由地／目的地</text>

  <path d="M315 350V432H375" class="line"/>
  <rect x="390" y="414" width="340" height="105" rx="14" fill="#fff4d8" stroke="#cfaa4a" stroke-width="2"/>
  <text x="560" y="451" text-anchor="middle" class="head">狭隘道路チェック</text>
  <text x="560" y="482" text-anchor="middle" class="body">迂回路を調べるシミュレーション</text>
  <text x="560" y="505" text-anchor="middle" class="small">結果を見て、人が本ルートを判断</text>

  <path d="M730 345H785V406" class="saveLine"/>
  <path d="M730 466H785V406" class="saveLine"/>
  <rect x="800" y="350" width="270" height="112" rx="14" fill="#edf7ed" stroke="#72a77a" stroke-width="2"/>
  <text x="935" y="389" text-anchor="middle" class="head">同じ旅行データ</text>
  <text x="935" y="420" text-anchor="middle" class="body">計画・経由地・確認結果</text>
  <text x="935" y="444" text-anchor="middle" class="small">両画面で共有して編集</text>

  <path d="M1070 406H1125" class="saveLine"/>
  <rect x="1140" y="338" width="245" height="146" rx="14" fill="#e8f2fb" stroke="#6d9bc0" stroke-width="2"/>
  <text x="1262" y="370" text-anchor="middle" class="head">保存先URLを1つ登録</text>
  <text x="1262" y="401" text-anchor="middle" class="body">OneDrive または iCloud</text>
  <text x="1262" y="427" text-anchor="middle" class="small">どちらかのURLを貼り付ける</text>
  <text x="1262" y="453" text-anchor="middle" class="small">最初に接続を許可</text>
  <text x="1262" y="474" text-anchor="middle" class="tiny">選んだ保存先へ同じデータを上書き</text>

  <path d="M1262 484V565H1070" class="line"/>
  <rect x="800" y="520" width="270" height="96" rx="14" fill="#fff" stroke="#8ba4b3" stroke-width="2"/>
  <text x="935" y="555" text-anchor="middle" class="head">保存状態を表示</text>
  <text x="935" y="585" text-anchor="middle" class="small">端末保存済／クラウド保存済／未同期</text>

  <rect x="65" y="557" width="665" height="112" rx="14" fill="#f7f8fa" stroke="#8ba4b3" stroke-width="2"/>
  <text x="92" y="593" class="head">画面の切替・復帰</text>
  <text x="94" y="624" class="body">「メニューへ戻る」→ 総合メニュー → 同じ旅行を開く</text>
  <text x="94" y="650" class="small">狭隘チェックを閉じても、旅行計画と保存状態は維持</text>
  <path d="M560 397V540H400V557" class="line"/>
  <path d="M560 519V540" class="line"/>

  <rect x="65" y="708" width="1318" height="205" rx="14" fill="#fff" stroke="#8ba4b3" stroke-width="2"/>
  <text x="92" y="746" class="head">保存のタイミング（提案）</text>
  <rect x="96" y="774" width="340" height="94" rx="12" fill="#edf7ed" stroke="#72a77a" stroke-width="2"/>
  <text x="266" y="809" text-anchor="middle" class="head">入力・変更のたび</text>
  <text x="266" y="841" text-anchor="middle" class="body">まず端末内へ自動保存</text>
  <path d="M436 821H505" class="saveLine"/>
  <rect x="520" y="774" width="370" height="94" rx="12" fill="#e8f2fb" stroke="#6d9bc0" stroke-width="2"/>
  <text x="705" y="809" text-anchor="middle" class="head">通信できる時</text>
  <text x="705" y="841" text-anchor="middle" class="body">登録したURLへ上書き保存・完了を確認</text>
  <path d="M890 821H959" class="saveLine"/>
  <rect x="974" y="774" width="370" height="94" rx="12" fill="#fff4d8" stroke="#cfaa4a" stroke-width="2"/>
  <text x="1159" y="809" text-anchor="middle" class="head">通信が切れた時</text>
  <text x="1159" y="841" text-anchor="middle" class="body">端末に保持し「未同期」と表示</text>

  <text x="68" y="948" class="small">※ OneDriveをWebページから自動利用するには、保存・同期の仕組みと利用許可の実装が必要です。端末内保存だけでは別端末へ移りません。</text>
  <text x="68" y="973" class="small">※ 保存先はOneDriveかiCloudのどちらか1つのURLを登録する案です。URLだけで上書きできるかは、サービスの許可方式を確認して実装します。</text>
</svg>
