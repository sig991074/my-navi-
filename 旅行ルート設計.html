<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CARナビ ルートプランナー</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Meiryo,sans-serif}button,input,select{font:inherit}#app{display:grid;grid-template-columns:minmax(650px,1fr) 440px;height:100vh}#mw{position:relative;border-right:2px solid #315a72}#map{position:absolute;inset:0}#top{position:absolute;z-index:1000;top:9px;left:50px;right:10px;display:grid;grid-template-columns:250px minmax(250px,1fr) 70px 90px;gap:6px}#title{height:42px;display:flex;align-items:center;justify-content:center;border:1px solid #5d829a;border-radius:5px;background:linear-gradient(90deg,#fff,#def5ff,#9bd5ef);font-size:18px;font-weight:bold}#q,#search,#pickBtn{height:42px;border-radius:5px}#q{border:1px solid #8199a7;padding:0 10px}#search,#pickBtn{border:0;background:#176fa7;color:#fff;font-weight:bold}#menus{position:absolute;z-index:1002;top:62px;left:10px;width:155px;display:grid;gap:5px}.menu{position:relative}.head{height:42px;padding:5px 8px;border:1px solid #9a8d48;border-radius:5px;background:#fff1ad;font-size:13px;font-weight:bold;line-height:15px;cursor:pointer}.head small{display:block;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:9px;line-height:12px;font-weight:normal;color:#45545e}.head:after{content:'▼';position:absolute;right:7px;top:13px}.pop{display:none;position:absolute;z-index:30;top:46px;left:0;width:155px;padding:5px;border:1px solid #7e909c;background:#fff;box-shadow:0 5px 15px #0005}.menu.open .pop{display:block}.pop button{display:block;width:100%;height:28px;margin-bottom:3px;font-size:11px;border:1px solid #c2ccd2;background:#fff;text-align:left}.pri{padding:6px;border:1px solid #bbc5cb;margin-bottom:3px;font-size:11px;cursor:grab}.pri:before{content:'☰ '}.drag{opacity:.4}#cards{position:absolute;z-index:1000;left:195px;right:10px;bottom:10px;display:none;grid-template-columns:1fr 1fr;gap:7px}.card{padding:9px;border:3px solid transparent;border-radius:6px;background:#fffffff5;box-shadow:0 2px 9px #0004;cursor:pointer}.card.on{border-color:#ff9800}.rn{font-weight:bold}.rd{font-size:12px;margin-top:4px}.confirm{width:100%;height:32px;margin-top:6px;border:0;background:#f2bf27;font-weight:bold}.confirmed{background:#52a85b;color:#fff}#plan{display:grid;grid-template-rows:auto auto 1fr auto;overflow:hidden}#ph{padding:9px;border-bottom:1px solid #aaa}#pn{text-align:center}#dateRow{display:grid;grid-template-columns:42px 1fr 94px;gap:6px;margin-top:7px}#sum{display:grid;grid-template-columns:repeat(5,1fr);border-bottom:1px solid #aaa}.s{text-align:center;padding:6px 2px;font-size:11px}.s b{display:block}#list{overflow:auto;padding:8px}.empty{text-align:center;padding:25px;color:#778}.pt{padding:7px;border-bottom:1px solid #aaa}.ptop{display:grid;grid-template-columns:42px 1fr auto}.badge{color:#fff;background:#388e3c;border-radius:8px;padding:2px 6px;font-size:10px}#foot{display:grid;grid-template-columns:1fr 1fr;gap:7px;padding:7px;background:#edf2f5}.fb{height:35px;background:#315f7d;color:#fff;border:0}#status{grid-column:1/-1;border:1px solid #bbb;padding:5px;font-size:11px}#candidate{position:absolute;z-index:1200;top:56px;left:305px;right:110px;display:none;max-height:300px;overflow:auto;background:#fff;box-shadow:0 5px 15px #0005}.ci{padding:8px;border-bottom:1px solid #ddd;cursor:pointer}.ci small{display:block;color:#677}.routeLock #add{background:#fff0a3}.routeOpen #add{opacity:.4;pointer-events:none}
</style></head><body class="routeOpen"><div id="app"><section id="mw"><div id="map"></div><div id="top"><div id="title">CARナビ　ルートプランナー</div><input id="q" placeholder="地名・住所・施設名を入力"><button id="search">検索</button><button id="pickBtn">地図上から</button></div><div id="menus"><div class="menu"><div class="head">車両<small id="vsmall">EV車</small></div><div class="pop"><button data-v="EV車">EV車</button><button data-v="一般車">一般車</button></div></div><div class="menu"><div class="head">寄り道<small id="ksmall">未選択</small></div><div class="pop"><button data-k="出発地">出発地</button><button data-k="目的地">目的地</button><button data-k="経由地・休憩">休憩</button><button data-k="経由地・観光">観光</button><button data-k="経由地・充電">充電</button><button data-k="経由地・宿泊">宿泊</button><button data-k="経由地・仕事">仕事</button></div></div><div class="menu"><div class="head">走行条件<small id="csmall">A</small></div><div class="pop"><div id="priority"><div class="pri" draggable="true" data-c="A">A 高速</div><div class="pri" draggable="true" data-c="B">B 無料高速</div><div class="pri" draggable="true" data-c="C">C バイパス</div><div class="pri" draggable="true" data-c="D">D 一般道</div><div class="pri" draggable="true" data-c="E">E 2車線</div><div class="pri" draggable="true" data-c="F">F 狭路除外</div></div></div></div><div class="menu"><div class="head">ルート<small id="rsmall">未選択</small></div><div class="pop"><button data-r="0">ルート1</button><button data-r="1">ルート2</button><button id="retry">再検索</button></div></div></div><div id="candidate"></div><div id="cards"></div></section><aside id="plan"><div id="ph"><div id="pn">EV旅行プランナー</div><div id="dateRow"><label>出発</label><input id="date" type="datetime-local"><button id="add">寄り道追加</button></div></div><div id="sum"><div class="s">距離<b id="dist">未計算</b></div><div class="s">時間<b id="dur">未計算</b></div><div class="s">料金<b>未設定</b></div><div class="s">電費<b id="eff">未計算</b></div><div class="s">残量<b id="soc">未計算</b></div></div><div id="list"><div class="empty">ルート確定後に工程を作成します</div></div><div id="foot"><button id="reverse" class="fb">逆ルート</button><button id="clear" class="fb">全消去</button><div id="status">出発地・目的地を設定してください</div></div></aside></div><script>
const $=id=>document.getElementById(id);let map,points=[],marks=[],routes=[],lines=[],selected=0,kind='出発地',vehicle='EV車',locked=false,results=[];const colors=['#5418d6','#e63b31'];addEventListener('DOMContentLoaded',()=>{map=L.map('map').setView([34.8531,135.7808],10);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());$('date').value=d.toISOString().slice(0,16);bind();drag()});
function bind(){document.querySelectorAll('.head').forEach(h=>h.onclick=e=>{e.stopPropagation();let m=h.parentElement;document.querySelectorAll('.menu').forEach(x=>{if(x!==m)x.classList.remove('open')});m.classList.toggle('open')});document.addEventListener('click',e=>{if(!e.target.closest('.menu'))close()});document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{vehicle=b.dataset.v;$('vsmall').textContent=vehicle;close()});document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{kind=b.dataset.k;$('ksmall').textContent=b.textContent;close()});document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{selectRoute(+b.dataset.r);close()});$('search').onclick=search;$('q').onkeydown=e=>{if(e.key==='Enter')search()};$('pickBtn').onclick=()=>{$('status').textContent='地図をクリックしてください';map.once('click',e=>{let n=prompt('地点名');if(n)addPoint(e.latlng,n)})};$('retry').onclick=routeSearch;$('clear').onclick=()=>location.reload();$('reverse').onclick=()=>{points.reverse();drawPoints();routeSearch()};$('add').onclick=()=>{kind='経由地・休憩';$('ksmall').textContent='休憩';locked=false;document.body.className='routeOpen';$('status').textContent='地図または検索で寄り道を追加'} }
function drag(){let x;document.querySelectorAll('.pri').forEach(i=>{i.ondragstart=()=>{x=i;i.classList.add('drag')};i.ondragend=()=>{i.classList.remove('drag');$('csmall').textContent=$('priority').firstElementChild.dataset.c;if(routes.length){rank();selectRoute(0)}};i.ondragover=e=>{e.preventDefault();if(!x||x===i)return;let r=i.getBoundingClientRect();$('priority').insertBefore(x,e.clientY<r.top+r.height/2?i:i.nextSibling)}})}
async function search(){let q=$('q').value.trim();if(!q)return;let j=await(await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=8&countrycodes=jp&accept-language=ja&q='+encodeURIComponent(q))).json();results=j;let c=$('candidate');c.innerHTML='';j.forEach((x,i)=>{let d=document.createElement('div');d.className='ci';d.innerHTML=q+'<small>'+x.display_name+'</small>';d.onclick=()=>{c.style.display='none';addPoint(L.latLng(+x.lat,+x.lon),q)};c.appendChild(d)});c.style.display=j.length?'block':'none'}
function addPoint(ll,name){let p={id:Date.now(),type:kind,name,lat:ll.lat,lng:ll.lng};if(kind==='出発地'){points=points.filter(x=>x.type!=='出発地');points.unshift(p)}else if(kind==='目的地'){points=points.filter(x=>x.type!=='目的地');points.push(p)}else{let i=points.findIndex(x=>x.type==='目的地');i<0?points.push(p):points.splice(i,0,p)}locked=false;document.body.className='routeOpen';drawPoints();render();if(points.length>=2)routeSearch()}
function drawPoints(){marks.forEach(m=>map.removeLayer(m));marks=[];let b=[];points.forEach(p=>{marks.push(L.circleMarker([p.lat,p.lng],{radius:7,color:'#fff',fillColor:'#388e3c',fillOpacity:1}).addTo(map));b.push([p.lat,p.lng])});if(b.length>1)map.fitBounds(b,{padding:[50,50]})}
async function routeSearch(){let c=points.map(p=>p.lng+','+p.lat).join(';');let j=await(await fetch('https://router.project-osrm.org/route/v1/driving/'+c+'?alternatives=true&overview=full&geometries=geojson')).json();routes=(j.routes||[]).slice(0,2);rank();selectRoute(0)}function rank(){let c=$('priority').firstElementChild.dataset.c;routes.sort((a,b)=>['C','D','E','F'].includes(c)?a.distance-b.distance:a.duration-b.duration)}
function selectRoute(i){if(!routes[i])return;selected=i;lines.forEach(l=>map.removeLayer(l));lines=[];routes.forEach((r,n)=>{let l=L.geoJSON(r.geometry,{style:{color:colors[n],weight:n===i?8:5,opacity:n===i?.95:.45}}).addTo(map);l.on('click',()=>selectRoute(n));lines.push(l)});map.fitBounds(L.geoJSON(routes[i].geometry).getBounds(),{padding:[60,60]});$('rsmall').textContent=''+(i+1);showCards();summary()}
function showCards(){let b=$('cards');b.innerHTML='';routes.forEach((r,i)=>{let d=document.createElement('div');d.className='card'+(i===selected?' on':'');d.innerHTML='<div class="rn">ルート'+(i+1)+'</div><div class="rd">'+(r.distance/1000).toFixed(1)+'km / '+time(Math.round(r.duration/60))+'</div><button class="confirm '+(locked&&i===selected?'confirmed':'')+'">'+(locked&&i===selected?'確定済み':'このルートを確定')+'</button>';d.onclick=e=>{selectRoute(i);if(e.target.classList.contains('confirm'))confirmRoute()};b.appendChild(d)});b.style.display='grid'}function confirmRoute(){locked=true;document.body.className='routeLock';$('status').textContent='ルート確定。充電・休憩・食事処を追加できます';showCards();render()}
function summary(){let r=routes[selected];if(!r)return;let km=r.distance/1000,e=vehicle==='EV車'?5.8:0;$('dist').textContent=km.toFixed(1)+'km';$('dur').textContent=time(Math.round(r.duration/60));$('eff').textContent=e||'対象外';$('soc').textContent=e?Math.max(0,90-(km/e)/64*100).toFixed(0)+'%':'対象外'}function render(){let b=$('list');b.innerHTML='';if(!locked){b.innerHTML='<div class="empty">2ルートから選択・手直し後、ルートを確定してください</div>';return}points.forEach((p,i)=>{let d=document.createElement('div');d.className='pt';d.innerHTML='<div class="ptop"><b>'+String((i+1)*10).padStart(3,'0')+'</b><span>'+p.name+'</span><span class="badge">'+p.type+'</span></div>';b.appendChild(d)})}function close(){document.querySelectorAll('.menu').forEach(x=>x.classList.remove('open'))}function time(m){return Math.floor(m/60)+'時間'+m%60+'分'}
</script></body></html>
