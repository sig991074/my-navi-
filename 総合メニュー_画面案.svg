<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" role="img" aria-labelledby="title desc">
  <title id="title">CARナビ ルートプランナー 総合メニュー（基礎データ入力とメニューを分けた画面案）</title>
  <desc id="desc">基礎データ入力画面でプラン名と日ごとの出発日時を入力し、総合メニューからルートプランナー、狭隘道路安全チェック、走行ナビ、ev旅行プランナー、evバッテリー諸元設定へ進む。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto-start-reverse">
      <path d="M0 0L12 6L0 12Z" fill="#31566d"/>
    </marker>
    <style>
      text{font-family:Meiryo,"Yu Gothic",sans-serif;fill:#17384b}
      .title{font-size:30px;font-weight:700}
      .screen{font-size:23px;font-weight:700}
      .head{font-size:21px;font-weight:700}
      .body{font-size:17px}
      .small{font-size:15px}
      .line{fill:none;stroke:#31566d;stroke-width:3;marker-end:url(#arrow)}
      .both{fill:none;stroke:#31566d;stroke-width:3;marker-start:url(#arrow);marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1440" height="1080" fill="#f3f7f9"/>
  <text x="48" y="54" class="title">CARナビ ルートプランナー 総合メニュー（画面案）</text>
  <text x="50" y="84" class="body">「基礎データ入力」と「メニュー」を別の画面に分けています。提案段階で、まだ実装されていません。</text>

  <!-- 画面1：基礎データ入力 -->
  <rect x="50" y="110" width="1340" height="210" rx="16" fill="#fff" stroke="#6d9bc0" stroke-width="3"/>
  <rect x="50" y="110" width="1340" height="52" rx="16" fill="#e8f2fb" stroke="#6d9bc0" stroke-width="3"/>
  <text x="80" y="146" class="screen">画面① 基礎データ入力</text>
  <text x="1360" y="146" text-anchor="end" class="small">（記入例）</text>

  <text x="90" y="205" class="body">・プラン名</text>
  <rect x="240" y="183" width="760" height="38" rx="8" fill="#f7f8fa" stroke="#8ba4b3" stroke-width="2"/>
  <text x="256" y="209" class="body">和歌山・熊野温泉めぐり車中泊の旅</text>

  <text x="90" y="262" class="body">・出発日時</text>
  <text x="240" y="262" class="body">1日目　26年6月13日 10:02</text>
  <text x="640" y="262" class="body">2日目　26年6月14日 9:02</text>
  <text x="1030" y="262" class="body">3日目　26年6月15日 9:35</text>
  <text x="240" y="300" class="small">入力が済んだら、総合メニューへ進みます。</text>

  <path d="M720 320V380" class="line"/>
  <text x="740" y="358" class="small">入力したプラン名・出発日時を引き継ぐ</text>

  <!-- 画面2：メニュー -->
  <rect x="50" y="390" width="1340" height="510" rx="16" fill="#fff" stroke="#7ba36f" stroke-width="3"/>
  <rect x="50" y="390" width="1340" height="52" rx="16" fill="#e6f2df" stroke="#7ba36f" stroke-width="3"/>
  <text x="80" y="426" class="screen">画面② 総合メニュー</text>
  <text x="520" y="426" class="body">プラン名：和歌山・熊野温泉めぐり車中泊の旅</text>

  <rect x="90" y="475" width="420" height="96" rx="14" fill="#e6f2df" stroke="#7ba36f" stroke-width="2"/>
  <text x="110" y="510" class="head">carナビ ルートプランナー</text>
  <text x="110" y="540" class="small">ルートの選定を行います。</text>

  <path d="M300 571V650" class="line"/>

  <rect x="90" y="655" width="420" height="96" rx="14" fill="#ffe4b0" stroke="#d09a3c" stroke-width="2"/>
  <text x="110" y="690" class="head">走行ナビ</text>
  <text x="110" y="720" class="small">実走行の案内ナビを起動します。</text>

  <path d="M510 523H650" class="both"/>

  <rect x="660" y="475" width="500" height="100" rx="14" fill="#e6f2df" stroke="#7ba36f" stroke-width="2"/>
  <text x="680" y="510" class="head">狭隘道路安全チェック</text>
  <text x="680" y="538" class="small">幹線道路一車線を20mごとに幅員チェック。</text>
  <text x="680" y="560" class="small">NGの場合、20km幅内の迂回路を表示します。</text>

  <path d="M510 700H650" class="both"/>

  <rect x="660" y="620" width="500" height="100" rx="14" fill="#e6f2df" stroke="#7ba36f" stroke-width="2"/>
  <text x="680" y="655" class="head">ev旅行プランナー</text>
  <text x="680" y="683" class="small">ルートを一本化し、観光地等の経由地を設定し、</text>
  <text x="680" y="705" class="small">充電プランも立てます。</text>

  <path d="M910 720V800" class="both"/>

  <rect x="660" y="805" width="500" height="76" rx="14" fill="#e6f2df" stroke="#7ba36f" stroke-width="2"/>
  <text x="680" y="837" class="head">evバッテリー諸元設定画面</text>
  <text x="680" y="865" class="small">evバッテリー消費、充電の基本諸元を設定する。</text>

  <!-- 注書き -->
  <rect x="50" y="920" width="1340" height="100" rx="12" fill="#fff9b8" stroke="#d6c84a" stroke-width="2"/>
  <text x="76" y="952" class="head">注書き</text>
  <text x="76" y="982" class="body">・このソフトはGitHubへ登録し、WebからAndroid、Apple製品のGoogle・Safariで利用できます。</text>
  <text x="96" y="1002" class="small">（Wi-Fiが中断した場合は、利用できません。）</text>
</svg>
